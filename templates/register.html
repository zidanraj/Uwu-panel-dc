<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Z3NITH UWU PANEL — Register</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070b14;--card:#0d1525;--border:#1a2a4a;--accent:#00e5ff;--accent2:#7c3aed;--text:#e2e8f0;--muted:#64748b;--danger:#ff4757}
body{background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;color:var(--text)}
.bg-mesh{position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 20% 50%,rgba(0,229,255,0.07),transparent),radial-gradient(ellipse 60% 60% at 80% 20%,rgba(124,58,237,0.08),transparent);z-index:0}
.card{position:relative;z-index:1;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px 44px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.6),0 0 80px rgba(0,229,255,0.04)}
.logo-title{font-size:24px;font-weight:800;letter-spacing:2px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;margin-bottom:4px}
.logo-sub{font-size:11px;color:var(--muted);letter-spacing:4px;text-transform:uppercase;text-align:center;margin-bottom:28px}
.invite-badge{background:rgba(0,229,255,0.08);border:1px solid rgba(0,229,255,0.2);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--accent);text-align:center;margin-bottom:22px;letter-spacing:1px}
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.field input{width:100%;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-size:14px;transition:border-color .2s;outline:none}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,229,255,0.1)}
.btn{width:100%;background:linear-gradient(135deg,var(--accent2),#5b21b6);border:none;border-radius:10px;padding:14px;color:#fff;font-weight:700;font-size:15px;letter-spacing:1px;cursor:pointer;transition:transform .15s,box-shadow .15s;margin-top:8px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(124,58,237,0.4)}
.error-box{background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.3);border-radius:10px;padding:12px 16px;color:var(--danger);font-size:13px;text-align:center;margin-bottom:18px}
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="card">
  <div class="logo-title">Z3NITH UWU</div>
  <div class="logo-sub">Create Your Account</div>
  <div class="invite-badge">🔗 Valid Invite — Set Your Credentials</div>
  {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
  <form method="POST">
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" placeholder="Choose a username" required autocomplete="off">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" placeholder="Choose a strong password" required>
    </div>
    <button class="btn" type="submit">CREATE ACCOUNT</button>
  </form>
</div>
</body>
</html>
